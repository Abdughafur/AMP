<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon">
</head>

<body id="main-body">

  <div id="drop-overlay">
    <h1>Drop Music to Add</h1>
  </div>

  <div class="player-card">
    <div class="album-art"><svg viewBox="0 0 24 24">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
      </svg></div>
    <div class="track-info">
      <h2 id="title">AMP</h2>
      <p id="artist">Abdu Music Player</p>
    </div>

    <div class="slider-wrap">
      <input type="range" id="progress" value="0" step="0.1">
      <div class="time-labels"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
    </div>

    <div class="controls">
      <div class="btn-svg" id="repeat-btn"><svg width="22" height="22" viewBox="0 0 24 24">
          <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zM13 15V9h-1l-2 1v1h1v4h2z" />
        </svg></div>
      <div class="btn-svg" onclick="skip(-10)"><svg width="26" height="26" viewBox="0 0 24 24">
          <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" />
        </svg></div>
      <div class="btn-svg" id="play-btn"><svg id="play-icon" width="55" height="55" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg></div>
      <div class="btn-svg" onclick="skip(10)"><svg width="26" height="26" viewBox="0 0 24 24">
          <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
        </svg></div>
      <div class="btn-svg" onclick="toggleFS()"><svg width="22" height="22" viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
        </svg></div>
    </div>

    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="action-btn" onclick="document.getElementById('file-input').click()"
        style="background:var(--accent); border:none">+ Add</button>
      <button class="action-btn" onclick="openModal('about-modal')">About</button>
    </div>
  </div>

  <div class="library-wrapper">
    <div class="library-header">
      <span>SONGS</span>
      <span class="clear-btn" onclick="openModal('confirm-all-modal')">Delete All</span>
    </div>
    <div id="library-list"></div>
  </div>

  <div class="modal-overlay" id="about-modal">
    <div class="modal-card">
      <h3>AMP</h3>
      <h1>Created by Abdughafur</h1>
      <p style="font-size:14px; opacity:0.6">Version 1.0.0</p>
      <a href="https://github.com/Abdughafur/AMP" target="_blank"
        style="text-decoration:none; color:white; display:block; margin: 20px 0;">
        <div style="background:#fff; color:#000; padding:12px; border-radius:15px; font-weight:700">GitHub repository
        </div>
      </a>
      <a href="https://github.com/Abdughafur" target="_blank"
        style="text-decoration:none; color:white; display:block; margin: 20px 0;">
        <div style="background:#fff; color:#000; padding:12px; border-radius:15px; font-weight:700">GitHub profile
        </div>
      </a>
      <button class="m-btn cancel" onclick="closeModals()">Close</button>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-single-modal">
    <div class="modal-card">
      <h3 style="color:var(--danger); margin-bottom:10px">Delete Song?</h3>
      <p id="delete-song-name" style="font-size:14px; margin-bottom:20px; color:white; font-weight:600"></p>
      <div class="modal-btns">
        <button class="m-btn confirm" onclick="executeDelete()">Delete From Local</button>
        <button class="m-btn cancel" onclick="closeModals()">Keep Song</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-all-modal">
    <div class="modal-card">
      <h3 style="color:var(--danger)">Delete All Songs?</h3>
      <p style="font-size:14px; opacity:0.7">This will remove every song from your browser storage permanently.</p>
      <div class="modal-btns">
        <button class="m-btn confirm" onclick="wipeLibrary()">Yes, Delete All</button>
        <button class="m-btn cancel" onclick="closeModals()">Cancel</button>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>
  <input type="file" id="file-input" accept=".mp3, .m4a" multiple>

  <script src="app.js"></script>
</body>

</html>
